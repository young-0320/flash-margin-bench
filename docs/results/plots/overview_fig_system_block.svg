<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Pretendard, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14">
<rect width="1100" height="520" fill="white"/>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="40" y="40" width="600" height="420" rx="12" fill="#fafafa" stroke="#333" stroke-width="2"/>
<text x="56" y="68" font-size="18" font-weight="700" fill="#222">Zybo Z7-20 (Zynq-7020) — 한 보드, 두 경로</text>
<rect x="60" y="90" width="285" height="232" rx="8" fill="#eef4fb" stroke="#7fa6cc" stroke-width="1.5"/>
<text x="72" y="113" font-weight="700" fill="#222">PL  측정 경로 — 위상 스윕</text>
<text x="72" y="134" font-size="12" fill="#333">MMCM 위상 이동 15.873ps/스텝</text>
<text x="72" y="153" font-size="12" fill="#333">샘플 클럭 위상만 민다</text>
<text x="72" y="172" font-size="12" fill="#333">(SCLK·명령은 고정)</text>
<text x="72" y="191" font-size="12" fill="#333">SPI 읽기 → PRBS15 비교</text>
<text x="72" y="210" font-size="12" fill="#333">→ 오류 카운터 → 욕조 곡선</text>
<text x="72" y="229" font-size="12" fill="#333">→ 유효 윈도우 폭(ps)</text>
<rect x="355" y="90" width="265" height="232" rx="8" fill="#fbeeee" stroke="#b23a3a" stroke-width="1.5"/>
<text x="367" y="113" font-weight="700" fill="#222">PS  마모 경로 — P/E 엔진</text>
<text x="367" y="134" font-size="12" fill="#333">섹터 0-6 프로그램·소거 반복</text>
<text x="367" y="153" font-size="12" fill="#333">소거 시간 = 명령 끝 → Busy 해제</text>
<text x="367" y="172" font-size="12" fill="#333">µs 타이머, 매 사이클 섹터별</text>
<text x="367" y="191" font-size="12" fill="#333">tally 2곳, 100회당 1바이트</text>
<text x="367" y="210" font-size="12" fill="#333">UART 행마다 체크섬</text>
<rect x="220" y="348" width="240" height="78" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
<text x="232" y="372" font-weight="700" fill="#222">W25Q64 SPI NOR (소켓)</text>
<text x="232" y="392" font-size="12" fill="#333">64비트 UID 로 개체 식별</text>
<text x="232" y="410" font-size="12" fill="#333">같은 핀, 비트스트림만 교체</text>
<line x1="202" y1="322" x2="290" y2="348" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
<line x1="487" y1="322" x2="400" y2="348" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
<text x="56" y="446" font-size="12" fill="#555">체크포인트마다 두 경로를 번갈아: 마모 → prep → 스윕 → 재개</text>
<rect x="690" y="90" width="370" height="190" rx="8" fill="#f6f6f6" stroke="#444" stroke-width="1.5"/>
<text x="702" y="113" font-weight="700" fill="#222">호스트 PC — Python 실행기</text>
<text x="702" y="134" font-size="12" fill="#333">run_wear.py: 구간·체크포인트·재개</text>
<text x="702" y="153" font-size="12" fill="#333">run_sweep_chip.py: prep → 스윕 → 분석</text>
<text x="702" y="172" font-size="12" fill="#333">UID 등록부 · P/E 장부 (추가만)</text>
<text x="702" y="191" font-size="12" fill="#333">네 경로 대조: 카운터·행 수·tally·UID</text>
<text x="702" y="210" font-size="12" fill="#333">CSV → 교정 표 → 역산 모델</text>
<rect x="690" y="310" width="370" height="96" rx="8" fill="#eef7ee" stroke="#4f8a4f" stroke-width="1.5"/>
<text x="702" y="333" font-weight="700" fill="#222">열화 환경 (옵션)</text>
<text x="702" y="354" font-size="12" fill="#333">Arduino PWM + DFR0457 전력 제어</text>
<text x="702" y="373" font-size="12" fill="#333">TMP117 센서, 일정 온도에서 같은 절차</text>
<line x1="640" y1="170" x2="690" y2="170" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
<line x1="690" y1="200" x2="640" y2="200" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
<text x="650" y="162" font-size="11" fill="#333">UART</text>
<text x="650" y="216" font-size="11" fill="#333">JTAG</text>
<text x="690" y="486" font-size="13" fill="#666">측정 결과·수치는 Ⅳ 참조</text>
</svg>