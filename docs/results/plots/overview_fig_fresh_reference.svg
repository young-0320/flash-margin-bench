<text x="74" y="310" font-size="14" fill="#222">섹터 0-6: 반복 소거 영역 → 닳은 값 e</text>
<rect x="50" y="321" width="16" height="16" rx="3" fill="#e9c6a0" stroke="#666" stroke-width="1"/>
<text x="74" y="334" font-size="14" fill="#222">섹터 7-31: 같은 128KB, 소거 교란 → 제외</text>
<rect x="50" y="345" width="16" height="16" rx="3" fill="#d7e8f7" stroke="#666" stroke-width="1"/>
<text x="74" y="358" font-size="14" fill="#222">섹터 32-127: 거의 안 지움 → 신품값 e₀ · 부류</text>
<rect x="540" y="40" width="520" height="84" rx="8" fill="#eef4fb" stroke="#7fa6cc" stroke-width="1.5"/>
<text x="552" y="63" font-weight="700" fill="#222">① 신품값과 부류 — 섹터 32-127 을 한 번 지운다</text>
<text x="552" y="84" font-size="13" fill="#333">소거 시간 중앙값 = 이 칩의 신품값 e₀</text>
<text x="552" y="103" font-size="13" fill="#333">e₀ 가 40ms 미만이면 빠른 무리, 아니면 느린 무리</text>
<rect x="540" y="146" width="520" height="64" rx="8" fill="#fbeeee" stroke="#b23a3a" stroke-width="1.5"/>
<text x="552" y="169" font-weight="700" fill="#222">② 닳은 값 — 섹터 0-6 을 한 번 지운다</text>
<text x="552" y="190" font-size="13" fill="#333">소거 시간 7개 e → 배율 e / e₀</text>
<rect x="540" y="232" width="520" height="142" rx="8" fill="#f3f3f3" stroke="#444" stroke-width="1.5"/>
<text x="552" y="255" font-weight="700" fill="#222">③ 이력을 아는 칩들의 곡선과 확률적으로 비교</text>
<text x="552" y="276" font-size="13" fill="#333">같은 무리의 교정 칩 × 섹터 곡선이 구성원</text>
<text x="552" y="295" font-size="13" fill="#333">구간마다 '이 값이 나올 확률'을 매겨 정규화</text>
<text x="552" y="314" font-size="13" fill="#333">칩마다 다른 노화 속도는 배율 r ∈ [½, 2] 로 적분</text>
<rect x="540" y="396" width="520" height="84" rx="8" fill="#eef7ee" stroke="#4f8a4f" stroke-width="1.5"/>
<text x="552" y="419" font-weight="700" fill="#222">④ 답 — 누적 P/E 횟수 x 의 범위</text>
<text x="552" y="440" font-size="13" fill="#333">가장 그럴듯한 구간(MAP) · 68% · 95% 구간</text>
<text x="552" y="459" font-size="13" fill="#333">점이 아니라 범위로 낸다 (수치는 Ⅳ)</text>
